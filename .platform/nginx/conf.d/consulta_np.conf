# Incluido en el bloque http de nginx (Elastic Beanstalk, Amazon Linux 2023).
# Mantener sincronizado con .ebextensions/01_consulta_np.config y la configuracion de la app:
#   client_max_body_size >= MAX_UPLOAD_MB (10) + ~1 MB de margen para el multipart.
#   proxy_read_timeout/proxy_send_timeout >= TIEMPO_MAXIMO_SEGUNDOS (600) + 60
#   e IdleTimeout del ALB (720) mayor que estos valores.
client_max_body_size 11m;
proxy_read_timeout 660s;
proxy_send_timeout 660s;
